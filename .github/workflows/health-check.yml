name: Daily Service Health Check

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check services and notify Telegram
        run: |
          check() {
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 40 "$1" 2>/dev/null)
            [ "$code" = "200" ] && echo "OK" || echo "FAIL:${code:-timeout}"
          }

          # Only the CF Worker is publicly reachable. chusMBp services (proxy/ai-pm/ai-learning)
          # were probed via the ngrok HTTP tunnel — retired 2026-07-11 (free-tier ERR_NGROK_727
          # blocked non-browser curl → permanent false-FAIL). They are now monitored by the ATung
          # watchdog over Tailscale + bore; GitHub Actions cannot reach them (no public tunnel).
          R2=$(check "${{ secrets.APP_URL }}/__up")

          fmt_crit() {
            [ "$2" = "OK" ] && echo "[OK] $1" || echo "[FAIL] $1 ($2)"
          }

          L2=$(fmt_crit "2560-app (CF Worker)" "$R2")

          CRITICAL_FAILS=$(printf '%s\n' "$R2" | grep -c "^FAIL" || true)
          DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M Taipei')

          if [ "$CRITICAL_FAILS" -eq 0 ]; then
            HEADER="✅ CF Worker healthy (${DATE})"
          else
            HEADER="🔴 ${CRITICAL_FAILS} critical service(s) DOWN (${DATE})"
          fi

          MSG=$(printf '%s\n%s' "$HEADER" "$L2")
          echo "$MSG"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.HEALTH_CHECK_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.HEALTH_CHECK_CHAT_ID }}" \
            --data-urlencode "text=${MSG}" > /dev/null

          [ "$CRITICAL_FAILS" -eq 0 ] || exit 1
