name: Daily outcome computation

on:
  schedule:
    - cron: "0 10 * * *"    # 6:00pm Taipei (UTC+8) — after scan + OHLCV cache is warm
  workflow_dispatch:          # manual trigger for testing

jobs:
  outcome:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (cold start can take 30-60s)
        run: |
          for i in 1 2 3 4; do
            curl -sf --max-time 30 "${{ secrets.APP_URL }}/health" > /dev/null && echo "App warm" && break
            echo "Still waking up ($i/4)..." && sleep 20
          done

      # This step used to be structurally unable to fail on an application
      # fault: /internal/outcome returned {ok:true} immediately and ran the work
      # in the background, so the curl measured only the HTTP handshake and the
      # `if: failure()` alert below could never fire. The endpoint now AWAITS
      # the run and reports what happened; --max-time 240 covers the added
      # benchmark-index refresh plus the fill batches.
      - name: Trigger outcome cron
        run: |
          set -euo pipefail
          body=$(curl -f --max-time 240 -X POST "${{ secrets.APP_URL }}/internal/outcome" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_SECRET }}")
          echo "$body" | jq .
          if [ "$(echo "$body" | jq -r '.ok')" != "true" ]; then
            echo "::error::outcome reported failures: $(echo "$body" | jq -c '{failed,indexRefreshFailed}')"
            exit 1
          fi

      # 靜默失敗 = 勝率統計悄悄變陳舊（隔日 run 會重試同一批列）。
      # 注意：runner 沒被 acquire 的失敗模式（2026-07-09 實例）連此 step 都不會跑，靠隔日自癒兜底。
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HEALTH_CHECK_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.HEALTH_CHECK_CHAT_ID }}" \
            -d text="🔴 2560 outcome 失敗 — 勝率統計未更新，或大盤指數序列抓不到（benchmark 會填不滿）。查 Actions log。" > /dev/null || true
