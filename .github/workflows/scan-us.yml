name: Scan — US stocks

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 6:00 AM Taipei next day (UTC+8), Mon–Fri — after US market close (4 PM EST/EDT)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: |
          for i in 1 2 3 4; do
            curl -sf --max-time 30 "${{ secrets.APP_URL }}/health" > /dev/null && echo "App warm" && break
            echo "Still waking up ($i/4)..." && sleep 20
          done

      # Response INSPECTED, not just received — see scan-tw.yml for why a green
      # run used to be compatible with silently losing a day's cross.
      - name: Trigger US stock scan
        run: |
          set -euo pipefail
          body=$(curl -f --max-time 240 -X POST "${{ secrets.APP_URL }}/internal/scan?market=us" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_SECRET }}")
          echo "$body" | jq .
          if [ "$(echo "$body" | jq -r '.ok')" != "true" ]; then
            echo "::error::scan reported failures: $(echo "$body" | jq -c '{fetchFailed,alertFailed}')"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HEALTH_CHECK_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.HEALTH_CHECK_CHAT_ID }}" \
            -d text="🔴 2560 scan-us 失敗 — 後端可能掛了，或掃描回報抓不到資料（該日交叉會永久漏掉）。查 Actions log 的 fetchFailed。" > /dev/null || true
