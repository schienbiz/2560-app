name: Morning AI summary

on:
  schedule:
    - cron: "0 0 * * *"        # 8:00am Taipei (UTC+8) daily
  workflow_dispatch:             # manual trigger for testing

jobs:
  morning-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: |
          for i in 1 2 3 4; do
            curl -sf --max-time 30 "${{ secrets.APP_URL }}/health" > /dev/null && echo "App warm" && break
            echo "Still waking up ($i/4)..." && sleep 20
          done

      # Same structural blind spot the outcome cron had: the endpoint used to
      # return {ok:true} and run in the background, so a 60s curl proved only
      # that the request arrived and this workflow was green whatever happened
      # to the digest. It now AWAITS the run; 240s covers one AI call per
      # symbol with a signal, per user.
      - name: Trigger morning summary
        run: |
          set -euo pipefail
          body=$(curl -f --max-time 240 -X POST "${{ secrets.APP_URL }}/internal/morning-summary" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_SECRET }}")
          echo "$body" | jq .
          if [ "$(echo "$body" | jq -r '.ok')" != "true" ]; then
            echo "::error::morning summary reported push failures: $(echo "$body" | jq -c '.')"
            exit 1
          fi

      # 靜默失敗 = 早報沒發而使用者不知道（user-facing 每日訊息，無自癒）。
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HEALTH_CHECK_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.HEALTH_CHECK_CHAT_ID }}" \
            -d text="🔴 2560 morning-summary 失敗 — 今日早報未發送。查 Actions log / Render dashboard。" > /dev/null || true
